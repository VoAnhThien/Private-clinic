services:
  # Database PostgreSQL 18
  postgres:
    image: postgres:15-alpine
    container_name: clinic-postgres
    environment:
      POSTGRES_DB: clinic_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - clinic-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinic_management"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Application (sử dụng image đã build sẵn)
  backend:
    build: .  # Sử dụng image đã build
    container_name: clinic-backend
    environment:
      # Biến môi trường sẽ override application.properties
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clinic_management
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_LOB_NON_CONTEXTUAL_CREATION: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - clinic-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  clinic-network:
    driver: bridge